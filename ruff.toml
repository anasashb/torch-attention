# A strict Ruff configuration with overrides for ML-specific syntax.

exclude = [
    "*.ipynb",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 80
indent-width = 4
target-version = "py311"

[lint]
select = [
    "E",    # PEP8 violations
    "F",    # Pyflakes
    "B",    # Bugbear
    "UP",   # Pyupgrade
    "W",    # PEP8 warnings
    "C90",  # Code complexity
    "N",    # PEP8 naming
    "ANN",  # Type hints
    "S",    # Bandit
    "T20",  # print() statements
    "SIM",  # Simplify
    "PTH",  # Use pathlib
]

ignore = [
    "E501",    # Let Black handle line length.
    "N802",    # Allow domain-standard uppercase function names.
    "N806",    # Allow matrix/tensor names like Q, K, V, B, H, L.
    "N812",    # Allow torch.nn.functional as F.
    "ANN401",  # Allow typing.Any in dynamic params.
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "T20", "C90"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
