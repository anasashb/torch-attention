[project]
name = "adlers"
version = "0.5.0"
description = "A unified package for PyTorch-based attention mechanisms from across domains"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "LICENSES/fast-transformers-MIT.txt",
    "LICENSES/Apache-2.0.txt",
    "NOTICE",
]
authors = [
    { name = "Bachana Anasashvili", email = "ba.anasashvili@gmail.com" },
]

dependencies = [
    "numpy>=2.2.5,<3.0.0",
    "torch>=2.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
test = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
]
torch-cpu = [
    "torch>=2.9.1",
]
torch-cuda = [
    "torch>=2.9.1",
]

[tool.uv]
default-groups = ["torch-cpu"]
conflicts = [
    [
        { group = "torch-cpu" },
        { group = "torch-cuda" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "torch-cpu" },
    { index = "pytorch-cu126", group = "torch-cuda" },
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["adlers"]
module-root = "src"
source-include = ["src"]
source-exclude = [
    "**/.mypy_cache",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--cov=adlers",
    "--cov-report=term-missing",
]
